<!doctype html><html><head><title>Admin · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container bb-page"><div class="bb-page-head"><div><div class="bb-eyebrow">Administration</div><h1 class="bb-title">Admin Panel</h1><p>Monitor platform activity and manage user access without leaving BorrowBox.</p></div></div><div id="err" class="alert alert-danger d-none"></div><section id="stats" class="item-grid"></section><div class="row g-4 mt-2"><div class="col-lg-8"><section class="bb-shell bb-panel"><div class="d-flex justify-content-between align-items-center gap-3 mb-3"><div><div class="bb-eyebrow">Members</div><h2 class="h4 fw-bold mb-0">User access</h2></div><input id="userSearch" class="form-control" style="max-width:260px" placeholder="Search users"></div><div class="table-responsive"><table class="table align-middle mb-0"><thead><tr><th>User</th><th>Role</th><th>Status</th><th class="text-end">Action</th></tr></thead><tbody id="users"></tbody></table></div></section></div><div class="col-lg-4"><section class="bb-shell bb-panel"><div class="bb-eyebrow">Popular</div><h2 class="h4 fw-bold">Most borrowed</h2><div id="popular" class="mt-3"></div></section></div></div></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>
let searchTimer;function showError(m){err.textContent=m;err.classList.remove('d-none')}function metric(label,value){const d=document.createElement('div');d.className='card bb-metric';const v=document.createElement('div');v.className='bb-metric-value';v.textContent=value;const l=document.createElement('div');l.className='bb-metric-label';l.textContent=label;d.append(v,l);return d}
async function loadUsers(){try{const q=encodeURIComponent(userSearch.value.trim());const x=await api('/api/admin/users?q='+q);users.textContent='';x.forEach(u=>{const tr=document.createElement('tr');const name=document.createElement('td');const b=document.createElement('strong');b.textContent=u.name;const small=document.createElement('div');small.className='bb-muted small';small.textContent=u.email;name.append(b,small);const role=document.createElement('td');role.textContent=u.role;const status=document.createElement('td');const badge=document.createElement('span');badge.className='bb-badge '+(u.is_active?'available':'cancelled');badge.textContent=u.is_active?'Active':'Suspended';status.append(badge);const action=document.createElement('td');action.className='text-end';const btn=document.createElement('button');btn.className='btn btn-sm '+(u.is_active?'btn-outline-danger':'btn-outline-success');btn.textContent=u.is_active?'Suspend':'Restore';btn.onclick=async()=>{try{await api('/api/admin/users/'+u.id+'/status',{method:'PUT',body:JSON.stringify({is_active:!u.is_active})});bbToast(u.is_active?'User suspended':'User restored');loadUsers()}catch(e){showError(e.message)}};action.append(btn);tr.append(name,role,status,action);users.append(tr)})}catch(e){showError(e.message)}}
requireRole('admin').then(async u=>{if(!u)return;try{const x=await api('/api/admin/stats');stats.textContent='';stats.append(metric('Users',x.users),metric('Active items',x.activeItems),metric('Active borrows',x.activeBorrows),metric('Completed exchanges',x.completed));const pop=await api('/api/admin/most-borrowed');popular.textContent='';if(!pop.length)popular.innerHTML='<div class="bb-muted small">No completed borrows yet.</div>';pop.forEach((i,n)=>{const d=document.createElement('div');d.className='d-flex justify-content-between gap-2 py-2 border-bottom';const a=document.createElement('span');a.textContent=`${n+1}. ${i.name}`;const b=document.createElement('strong');b.textContent=i.completed;d.append(a,b);popular.append(d)});await loadUsers()}catch(e){showError(e.message)}});userSearch.oninput=()=>{clearTimeout(searchTimer);searchTimer=setTimeout(loadUsers,250)};
</script></body></html>
