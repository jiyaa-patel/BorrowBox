<!doctype html><html><head><title>Profile · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container bb-page"><div class="bb-page-head"><div><div class="bb-eyebrow">Community profile</div><h1 class="bb-title">Trust Profile</h1><p>See exchange history, ratings and the signals that make borrowing easier.</p></div></div><div id="err" class="alert alert-danger d-none"></div><div id="p"></div></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>
function accountCard(u){const box=document.createElement('section');box.className='bb-account mt-4';[['Email',u.email],['Student ID',u.student_id],['Phone',u.phone],['Account type',u.role==='admin'?'Administrator':'Member']].forEach(([a,b])=>{const d=document.createElement('div');const s=document.createElement('small');s.textContent=a;const v=document.createElement('strong');v.textContent=b;d.append(s,v);box.append(d)});const o=document.createElement('div');o.className='d-flex align-items-center justify-content-end';const out=document.createElement('button');out.type='button';out.className='btn btn-outline-danger';out.textContent='Logout';out.onclick=()=>logout();o.append(out);box.append(o);return box}
requireLogin().then(async u=>{if(!u)return;const id=new URLSearchParams(location.search).get('id')||u.id;try{const x=await api('/api/users/'+id);p.textContent='';const shell=document.createElement('section');shell.className='bb-shell bb-panel';const top=document.createElement('div');top.className='d-flex flex-wrap justify-content-between gap-3 align-items-start';const who=document.createElement('div');const eye=document.createElement('div');eye.className='bb-eyebrow';eye.textContent='BorrowBox member';const h=document.createElement('h2');h.className='bb-title fs-2 mt-1 mb-1';h.textContent=x.name;const meta=document.createElement('div');meta.className='bb-muted';meta.textContent=`${x.department} · Year ${x.year} · ${x.campus_area}`;who.append(eye,h,meta);const trust=document.createElement('div');trust.className='text-end';const score=document.createElement('div');score.className='bb-metric-value';score.textContent=x.trust.score+'/100';const label=document.createElement('span');label.className='bb-badge available';label.textContent=x.trust.label;trust.append(score,label);top.append(who,trust);const bar=document.createElement('div');bar.className='bb-progress mt-4';const fill=document.createElement('span');fill.style.width=Math.max(0,Math.min(100,x.trust.score))+'%';bar.append(fill);shell.append(top,bar);const stats=document.createElement('div');stats.className='item-grid mt-4';[['Rating',x.rating.count?`${Number(x.rating.avg).toFixed(1)} ★`:'—'],['Reviews',x.rating.count],['Items lent',x.counts.lent],['Items borrowed',x.counts.borrowed],['On-time returns',x.on_time_pct+'%'],['Active listings',x.active_listings]].forEach(([a,b])=>{const c=document.createElement('div');c.className='card bb-metric';const v=document.createElement('div');v.className='bb-metric-value';v.textContent=b;const l=document.createElement('div');l.className='bb-metric-label';l.textContent=a;c.append(v,l);stats.append(c)});p.append(shell);if(x.id===u.id)p.append(accountCard(u));p.append(stats);const reviews=document.createElement('section');reviews.className='mt-4';const rh=document.createElement('div');rh.className='bb-page-head mb-3';rh.innerHTML='<div><div class="bb-eyebrow">Feedback</div><h2 class="h4 fw-bold mb-0">Reviews received</h2></div>';reviews.append(rh);if(!x.reviews.length)reviews.innerHTML+='<div class="bb-empty"><strong>No reviews yet</strong>Completed exchanges and reviews will appear here.</div>';else{x.reviews.forEach(r=>{const d=document.createElement('div');d.className='card p-3 mb-2';const line=document.createElement('div');line.className='fw-bold';line.textContent='★'.repeat(r.rating)+'☆'.repeat(5-r.rating);const c=document.createElement('div');c.className='bb-muted mt-1';c.textContent=r.comment||'No written comment.';d.append(line,c);reviews.append(d)})}p.append(reviews)}catch(e){err.textContent=e.message;err.classList.remove('d-none')}})
</script></body></html>
