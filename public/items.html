<!doctype html><html><head><title>Browse · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container bb-page"><div class="bb-page-head"><div><div class="bb-eyebrow">Discover</div><h1 class="bb-title">Browse Items</h1><p>Search the campus, filter what matters, and open a listing to check its dates.</p></div><a class="btn btn-outline-dark" href="wishlist.html">My Borrow List</a></div>
<form id="filters" class="bb-filterbar mb-4"><div class="row g-2 align-items-center"><div class="col-lg-4"><div class="bb-search"><input class="form-control" name="q" placeholder="Search item, owner or location"></div></div><div class="col-sm-6 col-lg-2"><select class="form-select" name="category" id="category"><option value="">All categories</option></select></div><div class="col-sm-6 col-lg-2"><input class="form-control" name="location" placeholder="Location"></div><div class="col-sm-6 col-lg-1"><select class="form-select" name="minRating" aria-label="Minimum rating"><option value="">Rating</option><option value="3">3★+</option><option value="4">4★+</option><option value="5">5★</option></select></div><div class="col-sm-6 col-lg-1"><select class="form-select" name="sort" aria-label="Sort"><option value="newest">Newest</option><option value="rating">Rating</option><option value="distance">Nearest</option></select></div><div class="col-lg-2 d-grid"><button type="button" id="near" class="btn btn-outline-primary">Find Near Me</button></div></div><input type="hidden" name="lat"><input type="hidden" name="lng"><input type="hidden" name="page" value="1"><div id="geoBar" class="bb-geo-bar d-none"><span id="geoText">Showing items near your location</span><label class="ms-auto d-flex align-items-center gap-2 mb-0">Within <select name="radius" class="form-select form-select-sm"><option value="1">1 km</option><option value="2">2 km</option><option value="5" selected>5 km</option><option value="10">10 km</option><option value="25">25 km</option></select></label><button type="button" id="clearGeo" class="btn btn-sm btn-outline-primary">Clear</button></div></form>
<div id="err" class="alert alert-danger d-none"></div><div id="results" class="item-grid"><div class="card p-4 skeleton">Loading items…</div><div class="card p-4 skeleton">Loading items…</div><div class="card p-4 skeleton">Loading items…</div></div><div id="pages" class="bb-pager mt-4"></div><div class="drop-zone alert mt-4 mb-0 text-center"><strong>My Borrow List</strong> · Drag an item card here to save it. On mobile, use the Save button.</div></main><div id="foot"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script src="js/geo.js"></script><script src="js/items.js"></script></body></html>
