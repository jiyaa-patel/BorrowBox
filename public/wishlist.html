<!doctype html><html><head><title>My Borrow List · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container bb-page"><div class="bb-page-head"><div><div class="bb-eyebrow">Saved for later</div><h1 class="bb-title">My Borrow List</h1><p>Keep useful items close, then open a listing when you are ready to request it.</p></div><a class="btn btn-primary" href="items.html">Browse more items</a></div><div id="err" class="alert alert-danger d-none"></div><div id="list" class="item-grid"></div></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>
requireLogin();async function load(){try{const x=await api('/api/wishlist');list.innerHTML='';if(!x.length){list.innerHTML='<div class="bb-empty" style="grid-column:1/-1"><strong>Your Borrow List is empty</strong>Save items while browsing so you can find them quickly later.</div>';return}x.forEach(i=>{const d=document.createElement('article');d.className='card bb-card-hover bb-item-card';const top=document.createElement('div');top.className='bb-item-top';const cat=document.createElement('span');cat.className='bb-kicker';cat.textContent=`${i.category.icon} ${i.category.name}`;const status=document.createElement('span');status.className='bb-badge '+i.availability.status;status.textContent=i.availability.status.replace('_',' ');top.append(cat,status);const h=document.createElement('h2');h.className='bb-item-title';h.textContent=i.name;const p=document.createElement('div');p.className='bb-item-meta';p.textContent=`${i.location} · ${i.rating.count?i.rating.avg+' ★':'No ratings yet'}`;const actions=document.createElement('div');actions.className='bb-item-actions';const view=document.createElement('a');view.href='item.html?id='+i.id;view.className='btn btn-primary flex-grow-1';view.textContent='View Item';const b=document.createElement('button');b.className='btn btn-outline-danger';b.textContent='Remove';b.onclick=async()=>{try{await api('/api/wishlist/'+i.id,{method:'DELETE'});bbToast('Removed from Borrow List');load()}catch(e){err.textContent=e.message;err.classList.remove('d-none')}};actions.append(view,b);d.append(top,h,p,actions);list.append(d)})}catch(e){err.textContent=e.message;err.classList.remove('d-none')}}load();
</script></body></html>
