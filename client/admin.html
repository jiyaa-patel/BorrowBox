<!doctype html><html><head><title>Admin · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container bb-page"><h1>Admin</h1><div id="stats" class="item-grid"></div><h2 class="mt-4">Users</h2><div class="table-responsive"><table class="table"><tbody id="users"></tbody></table></div><script>requireRole('admin').then(()=>{api('/api/admin/stats').then(x=>stats.innerHTML=`<div class="card p-3">Users ${x.users}</div><div class="card p-3">Active items ${x.activeItems}</div><div class="card p-3">Active borrows ${x.activeBorrows}</div><div class="card p-3">Completed ${x.completed}</div>`);api('/api/admin/users').then(x=>{users.innerHTML='';x.forEach(u=>{const tr=document.createElement('tr');const td=document.createElement('td');td.textContent=`${u.name} (${u.email}) · ${u.is_active?'Active':'Suspended'}`;tr.append(td);users.append(tr)})})})</script></body></html>
