<!doctype html><html><head><title>Wishlist · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container py-4"><h1>My Borrow List</h1><div id="list" class="item-grid"></div><script>requireLogin();async function load(){const x=await api('/api/wishlist');list.innerHTML='';x.forEach(i=>{const d=document.createElement('div');d.className='card p-3';const h=document.createElement('h3');h.textContent=i.name;const s=document.createElement('p');s.textContent=i.availability.status;const b=document.createElement('button');b.className='btn btn-outline-danger';b.textContent='Remove';b.onclick=async()=>{await api('/api/wishlist/'+i.id,{method:'DELETE'});load()};d.append(h,s,b);list.append(d)})}load()</script></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script></body></html>
