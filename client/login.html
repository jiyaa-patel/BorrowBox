<!doctype html><html><head><title>Login · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container bb-page"><h1>Login</h1><div id="err" class="alert alert-danger d-none"></div><form id="f" class="col-md-6"><input class="form-control mb-3" name="email" type="email" placeholder="Email" required><input class="form-control mb-3" name="password" type="password" placeholder="Password" required><label><input type="checkbox" name="remember"> Remember me</label><button class="btn btn-primary d-block mt-3">Login</button></form></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>getUser().then(u=>{if(u)location.href='dashboard.html'});f.onsubmit=async e=>{e.preventDefault();try{const o=Object.fromEntries(new FormData(f));o.remember=!!f.remember.checked;const x=await api('/api/auth/login',{method:'POST',body:JSON.stringify(o)});(o.remember?localStorage:sessionStorage).setItem('token',x.token);const n=new URLSearchParams(location.search).get('next');location.href=n&&n.startsWith('/')&&!n.startsWith('//')?n:'dashboard.html'}catch(x){err.textContent=x.message;err.classList.remove('d-none')}}</script></body></html>
