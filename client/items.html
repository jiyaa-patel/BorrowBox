<!doctype html><html><head><title>Browse · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container bb-page"><div class="bb-page-head"><div><div class="bb-eyebrow">Discover</div><h1 class="bb-title">Browse Items</h1><p>Search the campus, check availability, then request the dates you need.</p></div><a class="btn btn-outline-dark" href="wishlist.html">My Borrow List</a></div><form id="filters" class="row g-2 mb-4"><div class="col-md-4"><input class="form-control" name="q" placeholder="Search"></div><div class="col"><select class="form-select" name="category" id="category"><option value="">All categories</option></select></div><div class="col"><input class="form-control" name="location" placeholder="Location"></div><div class="col"><select class="form-select" name="minRating"><option value="">Any rating</option><option>3</option><option>4</option><option>5</option></select></div><div class="col"><select class="form-select" name="sort"><option value="newest">Newest</option><option value="rating">Rating</option></select></div><div class="col"><button type="button" id="near" class="btn btn-outline-primary">Find Near Me</button></div></form><div id="err" class="alert alert-danger d-none"></div><div id="results" class="item-grid"></div><div id="pages" class="mt-3"></div><div class="drop-zone alert alert-secondary mt-4">Drop an item card here to save it to My Borrow List</div></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>let seq=0,timer;const p=new URLSearchParams(location.search);api('/api/categories').then(x=>{category.innerHTML+=[...x].map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join('');for(const [k,v] of p)if(filters[k])filters[k].value=v;load()});function load(){const n=++seq,q=new URLSearchParams(new FormData(filters));history.replaceState(null,'','?'+q);api('/api/items?'+q).then(x=>{if(n!==seq)return;results.innerHTML='';x.items.forEach(i=>{const d=document.createElement('div');d.className='card p-3';d.draggable=true;d.dataset.id=i.id;d.ondragstart=e=>e.dataTransfer.setData('text/borrowbox-item',i.id);const h=document.createElement('h3');h.textContent=i.name;const meta=document.createElement('p');meta.textContent=`${i.category.icon} ${i.category.name} · ${i.location} · ${i.rating.count?i.rating.avg+' ★':'No ratings yet'}${i.distance_km!=null?' · '+(i.distance_km<1?Math.round(i.distance_km*1000)+' m':i.distance_km+' km')+' away':''}`;const a=document.createElement('a');a.href='item.html?id='+i.id;a.className='btn btn-primary';a.textContent='View Item';d.append(h,meta,a);results.append(d)});if(!x.items.length)results.textContent='No items found.'}).catch(e=>{err.textContent=e.message;err.classList.remove('d-none')})}filters.oninput=()=>{clearTimeout(timer);timer=setTimeout(load,300)};near.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(x=>{const q=new URLSearchParams(new FormData(filters));q.set('lat',x.coords.latitude);q.set('lng',x.coords.longitude);q.set('radius',localStorage.getItem('radius')||'1');location.search=q},()=>{err.textContent='Location unavailable';err.classList.remove('d-none')}):0;</script><script>const dz=document.querySelector('.drop-zone');dz.ondragover=e=>e.preventDefault();dz.ondrop=async e=>{e.preventDefault();const id=e.dataTransfer.getData('text/borrowbox-item');if(!/^\d+$/.test(id))return;try{await api('/api/wishlist/'+id,{method:'POST'});dz.textContent='Added to My Borrow List'}catch(x){dz.textContent=x.message}}</script></body></html>
