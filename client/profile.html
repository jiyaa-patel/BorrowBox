<!doctype html><html><head><title>Profile · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container py-4"><h1>Profile</h1><div id="p" class="card p-4"></div><script>requireLogin().then(u=>{const id=new URLSearchParams(location.search).get('id')||u.id;api('/api/users/'+id).then(x=>{p.textContent='';const h=document.createElement('h2');h.textContent=x.name;const d=document.createElement('p');d.textContent=`${x.department} · Year ${x.year} · ${x.campus_area}`;const t=document.createElement('p');t.textContent=`Trust: ${x.trust.score}/100 (${x.trust.label}) · Rating ${x.rating.count?x.rating.avg:'—'} · Lent ${x.counts.lent} · Borrowed ${x.counts.borrowed}`;p.append(h,d,t)})})</script></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script></body></html>
