<!doctype html><html><head><title>Register · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container py-4"><h1>Register</h1><div id="err" class="alert alert-danger d-none"></div><form id="f" class="row g-3"><input class="form-control" name="name" placeholder="Name" required><input class="form-control" name="email" type="email" placeholder="Email" required><input class="form-control" name="student_id" placeholder="Student ID" required><input class="form-control" name="password" type="password" minlength="8" placeholder="Password" required><input class="form-control" name="phone" pattern="[6-9][0-9]{9}" placeholder="Phone" required><input class="form-control" name="department" placeholder="Department" required><input class="form-control" name="year" type="number" min="1" max="5" placeholder="Year" required><input class="form-control" name="campus_area" placeholder="Campus area" required><button class="btn btn-primary">Create account</button></form></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>f.onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/register',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(f)))});location.href='login.html'}catch(x){err.textContent=x.message;err.classList.remove('d-none')}}</script></body></html>
