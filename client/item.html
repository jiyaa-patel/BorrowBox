<!doctype html><html><head><title>Item · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container py-4"><div id="err" class="alert alert-danger d-none"></div><article id="box"></article><div id="calendar" class="mt-4"></div><button id="request" class="btn btn-primary mt-3" data-bs-toggle="modal" data-bs-target="#m">Request to Borrow</button><button id="heart" class="btn btn-outline-danger mt-3">♡ Save</button><div class="modal" id="m"><div class="modal-dialog"><form id="rf" class="modal-content"><div class="modal-header"><h5>Borrow request</h5></div><div class="modal-body"><input name="start" type="date" class="form-control mb-2" required><input name="end" type="date" class="form-control mb-2" required><textarea name="message" maxlength="255" class="form-control" placeholder="Purpose / message"></textarea></div><div class="modal-footer"><button class="btn btn-primary">Send request</button></div></form></div></div><script>const id=new URLSearchParams(location.search).get('id');if(!/^\d+$/.test(id)){err.textContent='Invalid item id';err.classList.remove('d-none');request.disabled=true}else Promise.all([api('/api/items/'+id),fetch('/api/items/'+id+'/bookings').then(x=>x.json())]).then(([i,b])=>{box.innerHTML='';const h=document.createElement('h1');h.textContent=i.name;const p=document.createElement('p');p.textContent=i.description;const meta=document.createElement('p');meta.textContent=`${i.category.icon} ${i.category.name} · ${i.location} · ${i.owner.name}${i.owner.phone?' · '+i.owner.phone:' · Login to see contact'} · ${i.rating.count?i.rating.avg+' ★':'No ratings yet'}`;box.append(h,p,meta);localStorage.setItem('recentlyViewed',JSON.stringify([{id:i.id,name:i.name},...JSON.parse(localStorage.getItem('recentlyViewed')||'[]').filter(x=>x.id!==i.id)].slice(0,5)));calendar.textContent=`Available ${i.availability.from} to ${i.availability.to}. Booked: ${b.map(x=>x.start+'–'+x.end).join(', ')||'none'}`}).catch(e=>{err.textContent=e.message;err.classList.remove('d-none');request.disabled=true});rf.onsubmit=async e=>{e.preventDefault();try{await api('/api/requests',{method:'POST',body:JSON.stringify({item_id:Number(id),...Object.fromEntries(new FormData(rf))})});location.href='requests.html'}catch(x){err.textContent=x.message;err.classList.remove('d-none')}};heart.onclick=()=>api('/api/wishlist/'+id,{method:'POST'}).then(()=>heart.textContent='♥ Saved').catch(e=>alert(e.message));</script></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script></body></html>
