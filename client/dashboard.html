<!doctype html><html><head><title>Dashboard · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container py-4"><h1 id="hello">Dashboard</h1><div id="stats" class="item-grid"></div><h2 class="mt-4">Active borrows</h2><div id="active"></div><a href="requests.html">Requests waiting for you</a><script>requireLogin();api('/api/me/dashboard').then(x=>{hello.textContent='Hello, '+x.greeting;stats.innerHTML=Object.entries(x.stats).map(([k,v])=>`<div class="card p-3"><b>${v}</b><span>${k}</span></div>`).join('');active.innerHTML=x.activeBorrows.map(a=>`<div class="alert alert-${a.level==='red'?'danger':a.level==='yellow'?'warning':'success'}">${a.item}: ${a.due_in_days} days</div>`).join('')||'Nothing currently borrowed.'})</script></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>requireLogin()</script></body></html>
