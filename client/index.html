<!doctype html><html><head><title>Home · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container py-4"><section class="py-5 text-center"><h1>Borrow what you need. Lend what you don't.</h1><p class="lead">A campus borrowing community.</p><a class="btn btn-primary" href="items.html">Find an Item</a></section><div id="stats" class="row text-center"></div><h2 class="mt-5">Popular categories</h2><div id="cats" class="item-grid"></div><h2 class="mt-5">Recently listed</h2><div id="recent" class="item-grid"></div><h2 class="mt-5">How it works</h2><p>List → discover → request → exchange → return → review.</p><h2>Safety</h2><div id="rules"></div><h2>FAQ</h2><div id="faq"></div></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>Promise.all([fetch('/api/stats/public').then(r=>r.json()),fetch('/api/categories').then(r=>r.json()),fetch('/api/items?limit=6').then(r=>r.json())]).then(([s,c,i])=>{stats.innerHTML=Object.entries(s).map(([k,v])=>`<div class="col"><h3>${v}</h3><span>${k}</span></div>`).join('');cats.innerHTML=c.map(x=>`<a class="card p-3" href="items.html?category=${x.id}">${x.icon} ${x.name} (${x.item_count})</a>`).join('');recent.innerHTML=i.items.map(x=>`<a class="card p-3" href="item.html?id=${x.id}">${x.name}</a>`).join('')}).catch(()=>stats.textContent='—');</script></body></html>
