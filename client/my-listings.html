<!doctype html><html><head><title>My Listings · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container py-4"><h1>My Listings</h1><div id="err" class="alert alert-danger d-none"></div><div id="list" class="item-grid"></div></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>requireLogin();async function load(){const x=await api('/api/items/mine');list.innerHTML='';x.forEach(i=>{const d=document.createElement('div');d.className='card p-3';const h=document.createElement('h3');h.textContent=i.name;d.append(h);const p=document.createElement('p');p.textContent=i.availability.status;d.append(p);const e=document.createElement('a');e.href='list-item.html?id='+i.id;e.className='btn btn-sm btn-outline-primary';e.textContent='Edit';d.append(e);list.append(d)})}load()</script></body></html>
