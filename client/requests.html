<!doctype html><html><head><title>Requests · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container py-4"><div id="app"><h1>Requests</h1><div v-if="error" class="alert alert-danger">{{error}}</div><button class="btn btn-outline-primary me-2" @click="role='incoming';load()">Incoming</button><button class="btn btn-outline-primary" @click="role='outgoing';load()">Outgoing</button><input class="form-control my-3" v-model="search" placeholder="Search item or person"><div v-for="r in filtered" :key="r.id" class="card p-3 mb-2"><b>{{r.item_name}}</b><span>{{r.start_date}} – {{r.end_date}} · {{r.status}}</span><div class="mt-2" v-if="role==='incoming'"><button v-if="r.status==='requested'" @click="act(r,'accept')" class="btn btn-sm btn-success">Accept</button> <button v-if="r.status==='requested'" @click="act(r,'reject')" class="btn btn-sm btn-danger">Reject</button> <button v-if="r.status==='accepted'" @click="code(r)" class="btn btn-sm btn-primary">Generate handover code</button> <button v-if="r.status==='return_pending'" @click="act(r,'confirm-return')" class="btn btn-sm btn-success">Confirm return</button></div><div class="mt-2" v-else><template v-if="r.status==='accepted'"><input v-model="r.inputCode" maxlength="6" placeholder="6-digit code"><button @click="confirm(r)" class="btn btn-sm btn-primary">Confirm handover</button></template><button v-if="r.status==='borrowed'" @click="act(r,'return')" class="btn btn-sm btn-warning">Mark returned</button></div><div v-if="r.shownCode" class="alert alert-info mt-2">Code: {{r.shownCode}} (30 min)</div></div><p v-if="!filtered.length">No requests here.</p></div><script src="https://unpkg.com/vue@3/dist/vue.global.js"></script><script src="js/requests-app.js"></script></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script></body></html>
