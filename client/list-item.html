<!doctype html><html><head><title>List Item · BorrowBox</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><script>tailwind={config:{corePlugins:{preflight:false}}}</script><script src="https://cdn.tailwindcss.com"></script><link rel="stylesheet" href="css/app.css"></head><body><div id="nav"></div><main class="container bb-page"><div id="err" class="alert alert-danger d-none"></div><form id="f"><input class="form-control mb-2" name="name" placeholder="Item name" required><textarea class="form-control mb-2" name="description" placeholder="Description" required></textarea><select class="form-select mb-2" name="category_id" id="category" required></select><input class="form-control mb-2" name="location" placeholder="Location" required><input type="hidden" name="latitude"><input type="hidden" name="longitude"><button type="button" id="geo" class="btn btn-outline-secondary mb-2">Use my current location</button><div id="geoMsg"></div><input class="form-control mb-2" type="date" name="available_from" required><input class="form-control mb-2" type="date" name="available_to" required><button id="submit" class="btn btn-primary">Preview & Publish</button></form></main><div id="foot"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/api.js"></script><script src="js/auth.js"></script><script src="js/layout.js"></script><script>requireLogin();const today=new Date().toLocaleDateString('en-CA');f.available_from.min=today;f.available_to.min=today;api('/api/categories').then(x=>category.innerHTML=x.map(c=>`<option value="${c.id}">${c.icon} ${c.name}</option>`).join(''));const edit=new URLSearchParams(location.search).get('id');if(edit)api('/api/items/'+edit).then(x=>{for(const k of ['name','description','location'])f[k].value=x[k];f.category_id.value=x.category.id;f.available_from.value=x.availability.from;f.available_to.value=x.availability.to});geo.onclick=()=>navigator.geolocation?navigator.geolocation.getCurrentPosition(p=>{f.latitude.value=p.coords.latitude;f.longitude.value=p.coords.longitude;geoMsg.textContent='Location captured'},()=>geoMsg.textContent='Could not capture location',{timeout:5000}):geoMsg.textContent='Geolocation unsupported';f.oninput=()=>{if(!edit)localStorage.setItem('listingDraft',JSON.stringify(Object.fromEntries(new FormData(f))))};if(!edit){try{const d=JSON.parse(localStorage.getItem('listingDraft'));if(d&&confirm('Continue your unfinished listing?'))Object.entries(d).forEach(([k,v])=>{if(f[k])f[k].value=v})}catch{}}f.onsubmit=async e=>{e.preventDefault();submit.disabled=true;try{const b=Object.fromEntries(new FormData(f));await api(edit?'/api/items/'+edit:'/api/items',{method:edit?'PUT':'POST',body:JSON.stringify(b)});localStorage.removeItem('listingDraft');location.href='my-listings.html'}catch(x){err.textContent=x.message;err.classList.remove('d-none');submit.disabled=false}}</script></body></html>
